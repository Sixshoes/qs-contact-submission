<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <base target="_top" />
    <meta charset="UTF-8" />
    <style>
      :root {
        --fgu: #a6245c;
        --fgu-dark: #8a1e4c;
        --fgu-deep: #6b1639;
        --qs: #f2a900;
        --cream: #faf7f2;
      }
      * { box-sizing: border-box; }
      html,
      body {
        margin: 0;
        max-width: 100%;
        overflow-x: hidden;
      }
      body {
        font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
        background: linear-gradient(180deg, var(--cream) 0%, #f5f0eb 100%);
        color: #0f172a;
        min-height: 100vh;
      }
      .page-shell {
        width: 100%;
        max-width: 100%;
        margin-inline: auto;
        padding-inline: clamp(0.75rem, 1.5vw, 1.25rem);
        min-width: 0;
      }
      header {
        border-bottom: 1px solid rgba(166, 36, 92, 0.3);
        background: linear-gradient(135deg, var(--fgu), var(--fgu-dark), var(--fgu-deep));
        color: #fff;
        padding: 1.25rem 0 0;
      }
      .header-row {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
      }
      .header-title { margin: 0; font-size: 1.5rem; font-weight: 700; }
      .header-sub { margin: 0.35rem 0 0; font-size: 0.875rem; color: rgba(255,255,255,0.8); }
      .header-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
      }
      .btn {
        border: 1px solid rgba(255,255,255,0.3);
        background: rgba(255,255,255,0.1);
        color: #fff;
        border-radius: 0.5rem;
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
        cursor: pointer;
        text-decoration: none;
        font-family: inherit;
      }
      .btn:hover { background: rgba(255,255,255,0.2); }
      .btn:disabled { opacity: 0.55; cursor: wait; }
      .pool-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
        margin-top: 1.25rem;
      }
      .pool-tab {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        border: 0;
        border-bottom: 3px solid transparent;
        background: transparent;
        color: rgba(255,255,255,0.72);
        cursor: pointer;
        font-size: 0.95rem;
        font-weight: 600;
        padding: 0.75rem 1rem;
        font-family: inherit;
      }
      .pool-tab:hover { color: #fff; background: rgba(255,255,255,0.08); }
      .pool-tab--active {
        color: #fff;
        border-bottom-color: var(--qs);
        background: rgba(255,255,255,0.12);
      }
      .pool-tab-count {
        font-size: 0.75rem;
        font-weight: 700;
        background: rgba(255,255,255,0.18);
        border-radius: 999px;
        padding: 0.1rem 0.45rem;
      }
      .pool-tab--active .pool-tab-count { background: rgba(242, 169, 0, 0.35); }
      main { padding: 1rem 0 2rem; }
      .card {
        background: #fff;
        border-top: 1px solid #e2e8f0;
        border-bottom: 1px solid #e2e8f0;
        padding: 1rem;
        max-width: 100%;
        min-width: 0;
      }
      @media (min-width: 640px) {
        .card {
          border: 1px solid #e2e8f0;
          border-radius: 0.75rem;
          box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
      }
      .meta-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 1rem;
        font-size: 0.8125rem;
        color: #64748b;
        margin-bottom: 1rem;
      }
      .meta-bar a { color: var(--fgu); font-weight: 600; text-decoration: none; }
      .meta-bar a:hover { text-decoration: underline; }
      .panel-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }
      .panel-title {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1rem;
        font-weight: 600;
        margin: 0;
      }
      .panel-title-mark {
        display: inline-block;
        width: 4px;
        height: 1rem;
        border-radius: 999px;
        background: var(--fgu);
      }
      .search-input {
        width: 100%;
        max-width: 16rem;
        border: 1px solid #e2e8f0;
        border-radius: 0.5rem;
        padding: 0.45rem 0.75rem;
        font-size: 0.875rem;
        font-family: inherit;
      }
      .search-input:focus {
        outline: 2px solid rgba(166, 36, 92, 0.25);
        border-color: var(--fgu);
      }
      .status { font-size: 0.8125rem; color: #64748b; margin: 0 0 0.75rem; }
      .error {
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 0.5rem;
        color: #b91c1c;
        font-size: 0.875rem;
        margin-bottom: 1rem;
        padding: 0.75rem 1rem;
      }
      .hidden { display: none !important; }
      .tab-panel {
        max-width: 100%;
        min-width: 0;
      }
      .table-scroll {
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
      }
      table {
        width: max-content;
        min-width: 100%;
        max-width: none;
        border-collapse: collapse;
        font-size: 0.8125rem;
      }
      th {
        text-align: left;
        white-space: nowrap;
        border-bottom: 1px solid #e2e8f0;
        padding: 0.5rem;
        color: #475569;
        font-weight: 600;
        position: sticky;
        top: 0;
        background: #fff;
        z-index: 1;
      }
      td {
        white-space: nowrap;
        border-bottom: 1px solid #f1f5f9;
        padding: 0.5rem;
        color: #334155;
        max-width: 18rem;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      tr:hover td { background: #f8fafc; }
      .loading {
        padding: 3rem 1rem;
        text-align: center;
        color: #64748b;
        font-size: 0.9375rem;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="page-shell">
        <div class="header-row">
          <div>
            <h1 class="header-title">QS 聯絡人 Pool</h1>
            <p class="header-sub">永續辦內部工具 · 讀取共用試算表（含 2027 名單）</p>
          </div>
          <div class="header-actions">
            <button type="button" class="btn" id="btn-refresh">重新整理</button>
            <a class="btn" id="link-submit" href="https://sixshoes.github.io/qs-contact-submission/" target="_blank" rel="noopener noreferrer">→ 提交表單</a>
          </div>
        </div>
        <nav class="pool-tabs" aria-label="Pool 分頁">
          <button type="button" class="pool-tab pool-tab--active" data-tab="submissions">
            提交紀錄 <span class="pool-tab-count" id="count-submissions">0</span>
          </button>
          <button type="button" class="pool-tab" data-tab="academic">
            學術聯絡人池 <span class="pool-tab-count" id="count-academic">0</span>
          </button>
          <button type="button" class="pool-tab" data-tab="employer">
            雇主聯絡人池 <span class="pool-tab-count" id="count-employer">0</span>
          </button>
          <button type="button" class="pool-tab" data-tab="prior-academic">
            去年學術 <span class="pool-tab-count" id="count-prior-academic">0</span>
          </button>
          <button type="button" class="pool-tab" data-tab="prior-employer">
            去年雇主 <span class="pool-tab-count" id="count-prior-employer">0</span>
          </button>
        </nav>
        <div style="height:1.25rem"></div>
      </div>
    </header>

    <main class="page-shell">
      <div id="loading" class="loading">載入中…</div>
      <p id="error" class="error hidden" role="alert"></p>

      <div id="meta-bar" class="meta-bar hidden">
        <span id="meta-updated"></span>
        <a id="meta-sheet-link" href="#" target="_blank" rel="noopener noreferrer">開啟試算表</a>
      </div>

      <section id="panel-submissions" class="tab-panel card hidden" data-panel="submissions">
        <div class="panel-toolbar">
          <h2 class="panel-title"><span class="panel-title-mark"></span>提交紀錄</h2>
          <input type="search" class="search-input" data-search="submissions" placeholder="搜尋提交紀錄…" aria-label="搜尋提交紀錄" />
        </div>
        <p id="notice-submissions" class="status hidden"></p>
        <div id="table-submissions"></div>
      </section>
      <section id="panel-academic" class="tab-panel card hidden" data-panel="academic">
        <div class="panel-toolbar">
          <h2 class="panel-title"><span class="panel-title-mark"></span>學術聯絡人池</h2>
          <input type="search" class="search-input" data-search="academic" placeholder="搜尋學術聯絡人…" aria-label="搜尋學術聯絡人" />
        </div>
        <p id="notice-academic" class="status hidden"></p>
        <div id="table-academic"></div>
      </section>
      <section id="panel-employer" class="tab-panel card hidden" data-panel="employer">
        <div class="panel-toolbar">
          <h2 class="panel-title"><span class="panel-title-mark"></span>雇主聯絡人池</h2>
          <input type="search" class="search-input" data-search="employer" placeholder="搜尋雇主聯絡人…" aria-label="搜尋雇主聯絡人" />
        </div>
        <p id="notice-employer" class="status hidden"></p>
        <div id="table-employer"></div>
      </section>
      <section id="panel-prior-academic" class="tab-panel card hidden" data-panel="prior-academic">
        <div class="panel-toolbar">
          <h2 class="panel-title"><span class="panel-title-mark"></span>去年學術名單</h2>
          <input type="search" class="search-input" data-search="prior-academic" placeholder="搜尋去年學術…" aria-label="搜尋去年學術" />
        </div>
        <p id="notice-prior-academic" class="status hidden"></p>
        <div id="table-prior-academic"></div>
      </section>
      <section id="panel-prior-employer" class="tab-panel card hidden" data-panel="prior-employer">
        <div class="panel-toolbar">
          <h2 class="panel-title"><span class="panel-title-mark"></span>去年雇主名單</h2>
          <input type="search" class="search-input" data-search="prior-employer" placeholder="搜尋去年雇主…" aria-label="搜尋去年雇主" />
        </div>
        <p id="notice-prior-employer" class="status hidden"></p>
        <div id="table-prior-employer"></div>
      </section>
    </main>

    
    <script>
      var SUBMIT_SITE = 'https://sixshoes.github.io/qs-contact-submission/';
      var MAX_LIVE_ROWS = 200;
      var activeTab = 'submissions';
      var poolCache = {
        academic: [],
        employer: [],
        submissions: [],
        'prior-academic': [],
        'prior-employer': [],
      };
      var searchQueries = {
        academic: '',
        employer: '',
        submissions: '',
        'prior-academic': '',
        'prior-employer': '',
      };

      function $(id) { return document.getElementById(id); }

      function tableOptions(tabId) {
        if (String(tabId).indexOf('prior-') === 0) {
          return { reverse: false, maxRows: 5000 };
        }
        return { reverse: true, maxRows: MAX_LIVE_ROWS };
      }

      function escapeHtml(s) {
        return String(s ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function dataRowCount(matrix) {
        return matrix && matrix.length > 1 ? matrix.length - 1 : 0;
      }

      function filterRows(matrix, query) {
        if (!matrix || matrix.length < 2) return [];
        var rows = matrix.slice(1);
        var q = String(query || '').trim().toLowerCase();
        if (!q) return rows;
        return rows.filter(function (row) {
          return row.some(function (cell) {
            return String(cell ?? '').toLowerCase().indexOf(q) >= 0;
          });
        });
      }

      function renderTable(tabId, matrix, query) {
        var containerId = 'table-' + tabId;
        var noticeId = 'notice-' + tabId;
        var el = $(containerId);
        var noticeEl = $(noticeId);

        if (!matrix || matrix.length < 2) {
          el.innerHTML = '<p class="status">尚無資料</p>';
          noticeEl.classList.add('hidden');
          noticeEl.textContent = '';
          return;
        }

        var headers = matrix[0];
        var opts = tableOptions(tabId);
        var maxRows = opts.maxRows;
        var filtered = filterRows(matrix, query);
        var total = filtered.length;
        var truncated = total > maxRows;
        var rows = truncated ? filtered.slice(-maxRows) : filtered.slice();
        if (opts.reverse) rows.reverse();

        if (query && total === 0) {
          el.innerHTML = '<p class="status">沒有符合「' + escapeHtml(query) + '」的資料</p>';
          noticeEl.classList.add('hidden');
          return;
        }

        if (truncated) {
          noticeEl.textContent = '共 ' + total + ' 筆' + (query ? '（符合搜尋）' : '') + '，顯示最近 ' + maxRows + ' 筆';
          noticeEl.classList.remove('hidden');
        } else if (query) {
          noticeEl.textContent = '符合搜尋：' + total + ' 筆';
          noticeEl.classList.remove('hidden');
        } else {
          noticeEl.classList.add('hidden');
          noticeEl.textContent = '';
        }

        var th = headers.map(function (h) {
          return '<th>' + escapeHtml(h) + '</th>';
        }).join('');
        var tbody = rows.map(function (row) {
          var tds = headers.map(function (_, i) {
            var text = String(row[i] ?? '');
            return '<td title="' + escapeHtml(text) + '">' + escapeHtml(text) + '</td>';
          }).join('');
          return '<tr>' + tds + '</tr>';
        }).join('');
        el.innerHTML =
          '<div class="table-scroll"><table><thead><tr>' +
          th +
          '</tr></thead><tbody>' +
          tbody +
          '</tbody></table></div>';
      }

      function renderAllTables() {
        ['submissions', 'academic', 'employer', 'prior-academic', 'prior-employer'].forEach(function (tabId) {
          renderTable(tabId, poolCache[tabId], searchQueries[tabId]);
        });
      }

      function switchTab(tabId) {
        activeTab = tabId;
        document.querySelectorAll('.pool-tab').forEach(function (btn) {
          var active = btn.getAttribute('data-tab') === tabId;
          btn.classList.toggle('pool-tab--active', active);
        });
        document.querySelectorAll('.tab-panel').forEach(function (panel) {
          panel.classList.toggle('hidden', panel.getAttribute('data-panel') !== tabId);
        });
      }

      function showError(msg) {
        var el = $('error');
        if (!msg) {
          el.classList.add('hidden');
          el.textContent = '';
          return;
        }
        el.textContent = msg;
        el.classList.remove('hidden');
      }

      function setLoading(loading) {
        $('loading').classList.toggle('hidden', !loading);
        $('btn-refresh').disabled = loading;
      }

      function applyData(data) {
        setLoading(false);
        if (!data || !data.ok) {
          showError((data && data.error) || '讀取失敗');
          $('meta-bar').classList.add('hidden');
          return;
        }

        showError('');
        poolCache.academic = data.academic || [];
        poolCache.employer = data.employer || [];
        poolCache.submissions = data.submissions || [];
        poolCache['prior-academic'] = data.priorAcademic || [];
        poolCache['prior-employer'] = data.priorEmployer || [];

        $('count-academic').textContent = String(dataRowCount(poolCache.academic));
        $('count-employer').textContent = String(dataRowCount(poolCache.employer));
        $('count-submissions').textContent = String(dataRowCount(poolCache.submissions));
        $('count-prior-academic').textContent = String(dataRowCount(poolCache['prior-academic']));
        $('count-prior-employer').textContent = String(dataRowCount(poolCache['prior-employer']));

        if (data.updatedAt) {
          $('meta-updated').textContent = '更新時間：' + data.updatedAt;
        }
        if (data.spreadsheetUrl) {
          var link = $('meta-sheet-link');
          link.href = data.spreadsheetUrl;
          link.classList.remove('hidden');
        }
        $('meta-bar').classList.remove('hidden');

        renderAllTables();
        switchTab(activeTab);
      }

      function loadData() {
        setLoading(true);
        showError('');
        google.script.run
          .withSuccessHandler(applyData)
          .withFailureHandler(function (err) {
            setLoading(false);
            showError(err && err.message ? err.message : String(err));
          })
          .getPoolData();
      }

      document.querySelectorAll('.pool-tab').forEach(function (btn) {
        btn.addEventListener('click', function () {
          switchTab(btn.getAttribute('data-tab'));
        });
      });

      document.querySelectorAll('.search-input').forEach(function (input) {
        input.addEventListener('input', function () {
          var tabId = input.getAttribute('data-search');
          searchQueries[tabId] = input.value;
          renderTable(tabId, poolCache[tabId], searchQueries[tabId]);
        });
      });

      $('btn-refresh').addEventListener('click', loadData);
      $('link-submit').href = SUBMIT_SITE;
      loadData();
    </script>
  </body>
</html>
