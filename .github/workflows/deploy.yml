name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          # 與下方 repo 名稱一致；若改名請同步修改
          SITE: https://sixshoes.github.io
          BASE: /qs-contact-submission/
          PUBLIC_GOOGLE_SCRIPT_URL: https://script.google.com/macros/s/AKfycbzRS2On9J60R37GHPm7_dwlTP4tzLQDob5yDWHIQ3Fl-W12cPogA3wkc1Qa1DOipV7NOA/exec
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
